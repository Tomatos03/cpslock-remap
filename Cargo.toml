[package]
name = "caplock_remap"
version = "0.1.0"
edition = "2024"

[dependencies]
interception = "0.1.2"
image = "0.25.8"
once_cell = "1.21.3"
tray-icon = "0.21.1"
winit = "0.30.12"
log = "0.4.28"
env_logger = "0.11.8"
native-windows-gui = "1.0.13"
native-windows-derive = "1.0.5"
serde_json = "1.0.145"
serde = { version = "1.0.228", features = ["derive"] }

[build-dependencies]
# 把 comctl32 v6 的应用程序清单内嵌进 exe，见 build.rs
embed-manifest = "1.5.1"

[profile.release]
lto = "fat"          # 或 "thin" 以加快编译
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3        # 或 "z" 以最小化体积
debug = false
debug-assertions = false
overflow-checks = false
incremental = false
