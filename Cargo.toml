[package]
name = "caplock_remap"
version = "0.1.0"
edition = "2024"

[dependencies]
interception = "0.1.2"
image = "0.25.8"
once_cell = "1.21.3"
tray-icon = "0.21.1"
winit = "0.30.12"
log = "0.4.28"
env_logger = "0.11.8"
native-windows-gui = "1.0.13"
native-windows-derive = "1.0.5"
serde_json = "1.0.145"
serde = { version = "1.0.228", features = ["derive"] }

[profile.release]
lto = true               # 链接时优化
panic = "abort"          # 去掉栈展开
strip = true             # 自动剥符号
